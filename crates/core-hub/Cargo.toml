[package]
name = "core-hub"
version = "0.1.0"
edition = "2021"
description = "Central home climate controller, automation hub and tablet web server for Raspberry Pi Zero 2 W"

[dependencies]
cn105-proto = { path = "../cn105-proto" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rumqttc = "0.24"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
mime_guess = "2.0"
